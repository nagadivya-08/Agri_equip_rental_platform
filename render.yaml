services:
  # =========================================================
  # AgriRent Backend Web Service (Node.js / Express API)
  # =========================================================
  - type: web
    name: agri-equip-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        fromService:
          type: web
          name: agri-equip-backend
          envVarKey: MONGO_URI
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # =========================================================
  # AgriRent Frontend Static Site (React + Vite SPA)
  # =========================================================
  - type: web
    name: agri-equip-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
